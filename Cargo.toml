[workspace]
resolver = "2"
members = [
    "crates/delilx-core",
    "crates/delilx-cli",
    "crates/delilx-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["DelilX Projesi"]
license = "MIT"
repository = "https://github.com/azmisahin-gov/DelilX"
description = "DelilX - Adli bilişim veri edinim ve inceleme uygulaması"

[workspace.dependencies]
delilx-core = { path = "crates/delilx-core" }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anyhow = "1"
walkdir = "2"
printpdf = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
