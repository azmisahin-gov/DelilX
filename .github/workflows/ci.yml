name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust biçim denetimi
  bicim:
    name: Biçim Denetimi (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Biçim kontrolü
        run: cargo fmt --all -- --check

  # Clippy statik analiz
  clippy:
    name: Clippy (uyarılar hata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Sistem bağımlılıkları (GUI için)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Otomatik testler
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y ewf-tools libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev
      - name: Testler
        run: cargo test --workspace --verbose
      - name: E01 uyumluluk testleri
        run: cargo test -p delilx-core --test e01_compat -- --test-threads=1

  # Windows x64 derleme kontrolü
  windows-derleme:
    name: Windows x64 Derleme
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
      - name: Derleme
        run: cargo build --release --workspace
      - name: Testler (Windows)
        run: cargo test --workspace --release
